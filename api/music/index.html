<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Music API</title>
    <script>
        // STRICT URL VALIDATION
        const requiredBase = 'https://api-uxidone.github.io/api/music';
        
        // Check if URL has slash before parameters
        if (window.location.href.includes('/music/?')) {
            // PERMANENT redirect to correct format
            window.location.href = window.location.href.replace('/music/?', '/music?');
            return;
        }
        
        // Verify exact base URL
        if (!window.location.href.startsWith(requiredBase + '?')) {
            document.body.innerHTML = `
                <h1>400 Bad Request</h1>
                <p>Use exact format:</p>
                <pre>${requiredBase}?player=v2/play/musicplayer&amp;version=v2/play&amp;from=assets-uxidone.github.io/assets/music/putvejini.mp3</pre>
                <p style="color:red">ERROR: Remove slash before question mark</p>
            `;
            return;
        }

        // VALID REACHES HERE - Create player
        document.body.innerHTML = `
            <audio controls autoplay>
                <source src="https://assets-uxidone.github.io/assets/music/putvejini.mp3" type="audio/mpeg">
            </audio>
            <p>Now playing: Pūt, vējiņi</p>
        `;
    </script>
</head>
<body>
</body>
</html>
