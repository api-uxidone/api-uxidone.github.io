<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Music Player API</title>
    <script>
        // Remove any trailing slash from the path
        if (window.location.pathname.endsWith('/')) {
            window.location.pathname = window.location.pathname.replace(/\/$/, '');
            return;
        }

        // Parse query parameters
        const params = new URLSearchParams(window.location.search);
        const player = params.get('player');
        const version = params.get('version');
        const from = params.get('from');
        
        // Validate parameters
        const isValid = player === 'v2/play/musicplayer' && 
                      version === 'v2/play' && 
                      from === 'assets-uxidone.github.io/assets/music/putvejini.mp3';

        if (isValid) {
            // Create audio player
            const audio = document.createElement('audio');
            audio.controls = true;
            audio.innerHTML = `
                <source src="https://assets-uxidone.github.io/assets/music/putvejini.mp3" type="audio/mpeg">
                Your browser doesn't support audio element.
            `;
            document.body.appendChild(audio);
            audio.play().catch(e => console.log('Autoplay blocked'));
        } else {
            // Show error
            document.body.innerHTML = `
                <h1>400 Bad Request</h1>
                <p>Use this exact format:</p>
                <pre>
https://api-uxidone.github.io/api/music?player=v2/play/musicplayer
&version=v2/play
&from=assets-uxidone.github.io/assets/music/putvejini.mp3
                </pre>
            `;
        }
    </script>
</head>
<body>
    Loading...
</body>
</html>
