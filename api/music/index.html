<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Music API Endpoint</title>
    <script>
        // Parse query parameters
        const params = new URLSearchParams(window.location.search);
        const player = params.get('player');
        const version = params.get('version');
        const from = params.get('from');
        
        // Validate the request matches your expected format
        if (player === 'v2/play/musicplayer' && 
            version === 'v2/play' && 
            from === 'assets-uxidone.github.io/assets/music/putvejini.mp3') {
            
            // Redirect to the actual music file
            window.location.href = '/assets/music/putvejini.mp3';
            
        } else {
            // Return error if parameters don't match
            document.body.innerHTML = `
                <h1>400 Bad Request</h1>
                <p>Invalid request parameters</p>
                <p>Required format:</p>
                <pre>
api-uxidone.github.io/api/music?player=v2/play/musicplayer
&version=v2/play
&from=assets-uxidone.github.io/assets/music/putvejini.mp3
                </pre>
            `;
        }
    </script>
</head>
<body>
    Redirecting to music file...
</body>
</html>
