<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Proxy API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .iframe-container {
            width: 100%;
            height: 100vh;
            border: none;
        }
        .error-container {
            background-color: #ffebee;
            color: #c62828;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
            text-align: center;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="content">
            <div class="loading">Checking game availability...</div>
        </div>
    </div>

    <script>
        // Get the target URL from query parameters
        const params = new URLSearchParams(window.location.search);
        const targetUrl = params.get('get');

        // DOM elements
        const contentDiv = document.getElementById('content');

        // Function to validate URL
        function isValidGameUrl(url) {
            try {
                const parsedUrl = new URL(url);
                return parsedUrl.hostname === 'games-uxidone.github.io' && 
                       parsedUrl.pathname.startsWith('/games/memorygame/');
            } catch (e) {
                return false;
            }
        }

        // Function to show error
        function showError(message) {
            contentDiv.innerHTML = `
                <div class="error-container">
                    <h2>400 Bad Request</h2>
                    <p>${message}</p>
                    <p>Example valid URL: /api/games/?get=https://games-uxidone.github.io/games/memorygame/</p>
                </div>
            `;
            
            // Set HTTP status code (works when served with proper headers)
            document.title = "400 Bad Request";
            history.replaceState(null, null, "?400");
        }

        // Function to show iframe
        function showIframe(url) {
            contentDiv.innerHTML = `
                <iframe 
                    src="${url}" 
                    class="iframe-container"
                    title="Game Content"
                    allow="fullscreen"
                ></iframe>
            `;
        }

        // Function to check URL availability
        async function checkUrl(url) {
            try {
                const response = await fetch(url, { 
                    method: 'HEAD',
                    mode: 'no-cors'
                });
                
                // If we get any response, consider it valid
                showIframe(url);
            } catch (error) {
                showError('The requested game could not be loaded. Please check the URL and try again.');
            }
        }

        // Main execution
        if (!targetUrl) {
            showError('Missing required parameter: get');
        } else if (!isValidGameUrl(targetUrl)) {
            showError('Invalid game URL. Only games from games-uxidone.github.io/games/memorygame/ are allowed.');
        } else {
            checkUrl(targetUrl);
        }
    </script>
</body>
</html>
